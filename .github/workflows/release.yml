name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr_branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName }}
      pr_number: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.pr_branch != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || needs.release-please.outputs.pr_branch }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev pkg-config libxkbcommon-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(jq -r '."."' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"
      - run: cargo build --release --locked -p soundboard
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="soundboard-${{ steps.version.outputs.version }}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/soundboard assets/soundboard.desktop assets/soundboard.png README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "soundboard-${{ steps.version.outputs.version }}-x86_64-windows"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/soundboard.exe, README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  prerelease:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created != 'true' && needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Replace the pre-release
        run: |
          version="$(jq -r '."."' .release-please-manifest.json)"
          gh release list --json tagName,isPrerelease -q '.[] | select(.isPrerelease) | .tagName' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
          gh release create "v${version}-pre" dist/* \
            --prerelease \
            --target "${{ needs.release-please.outputs.pr_branch }}" \
            --title "v${version} (pre-release)" \
            --notes "Build of release PR #${{ needs.release-please.outputs.pr_number }}, which becomes v${version} when merged. It is rebuilt whenever main changes."

  release:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload assets and remove pre-releases
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/* --clobber
          gh release list --json tagName,isPrerelease -q '.[] | select(.isPrerelease) | .tagName' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
