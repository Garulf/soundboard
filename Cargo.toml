[workspace]
resolver = "3"
members = ["crates/core", "crates/platform", "crates/remote", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Garulf/soundboard"
authors = ["Garulf"]

[workspace.dependencies]
soundboard-core = { path = "crates/core" }
soundboard-platform = { path = "crates/platform" }
soundboard-remote = { path = "crates/remote" }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time"] }
rtrb = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
